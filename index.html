<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="task-card">
    <h1>Task Manager</h1>
    <p class="subtitle">Add, complete, search and organise your tasks</p>

    <div class="theme-controls">
    <button onclick="setTheme('purple')">Purple</button>
    <button onclick="setTheme('blue')">Blue</button>
    <button onclick="setTheme('green')">Green</button>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <div class="input-box">
      <input id="taskInput" type="text" placeholder="Enter a task">
      <input id="dueDateInput" type="date">
      <button onclick="addTask()">Add</button>
    </div>

    <input id="searchInput" type="text" placeholder="Search tasks..." class="search-input">

    <div class="filters">
      <button onclick="setFilter('all')">All</button>
      <button onclick="setFilter('active')">Active</button>
      <button onclick="setFilter('completed')">Completed</button>
    </div>

    <p id="taskCounter" class="counter">0 tasks remaining</p>

    <ul id="taskList"></ul>

    <button class="clear-btn" onclick="clearAllTasks()">Clear All</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
